name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc

          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc

          - os: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc

          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang

          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26"

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            pkg-config

      - name: Generate and build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          sqlc generate
          go generate ./...

          EXT=""
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi

          go build \
            -ldflags="$LDFLAGS" \
            -trimpath \
            -o dist/smart-pc-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/smart-pc

      - name: Package binary
        shell: bash
        run: |
          cd dist
          NAME="smart-pc-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a ${NAME}.zip ${NAME}.exe
            rm ${NAME}.exe
          else
            tar -czf ${NAME}.tar.gz ${NAME}
            rm ${NAME}
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/download-artifact@v8.0.1
        with:
          name: binary-windows-amd64
          path: dist/

      - name: Extract and rename binary for Inno Setup
        shell: bash
        run: |
          7z e dist/smart-pc-windows-amd64.zip -odist/ smart-pc-windows-amd64.exe
          mv dist/smart-pc-windows-amd64.exe dist/smart-pc.exe

      - name: Build Inno Setup installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc /DMyAppVersion=$version build\installer.iss

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-installer
          path: build/Output/smart-pc-agent-setup-*.exe

  release:
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum smart-pc-* > checksums.txt

      - uses: softprops/action-gh-release@v3.0.0
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}