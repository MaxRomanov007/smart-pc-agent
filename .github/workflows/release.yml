name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Каждая платформа собирается на своём runner'е
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc

          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc  # кросс-компилятор, но linux→linux ок

          - os: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc  # mingw встроен в windows runner

          - os: macos-latest
            goos: darwin
            goarch: amd64
            cc: clang

          - os: macos-latest
            goos: darwin
            goarch: arm64
            cc: clang

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0

      - name: Install ARM64 cross-compiler (Linux only)
        if: matrix.os == 'ubuntu-latest' && matrix.goarch == 'arm64'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Generate and build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        shell: bash
        run: |
          sqlc generate
          go generate ./...

          EXT=""
          LDFLAGS="-s -w -X main.version=${{ github.ref_name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi

          go build \
            -ldflags="$LDFLAGS" \
            -trimpath \
            -o dist/smart-pc-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} \
            ./cmd/smart-pc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # После сборки всех бинарей — создаём релиз
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true  # changelog из PR и коммитов
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Отдельный job для Windows UI-инсталлятора
  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: binary-windows-amd64
          path: dist/

      - name: Build Inno Setup
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc /DMyAppVersion=$version build\installer.iss

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: build/Output/SmartPC-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}